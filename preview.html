<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>ContextBridge - Edge-to-Edge Developer Workstation</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #F8FAFC;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen w-full">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const initialData = {
      commitSha: '8f2a1c9',
      sourceBranch: 'feat/jwt-session-revocation',
      targetBranch: 'main',
      additions: 48,
      deletions: 12,
      fileCount: 2,
      model: 'Sonnet 3.5',
      confidence: 99.4,
      title: 'feat(auth): migrate session store to Valkey cluster with zero-downtime pipeline',
      whyContext: 'In alignment with ADR-009 and approved architectural direction in Notion RFC-088, this change completes Phase 2 of our telemetry and credential store separation. It directly addresses the Redis pool exhaustion incident documented in Sentry AUTH-892. Legacy single-instance Redis keys (session:*) are deprecated in favor of partitioned pipelines across the new Valkey cluster.',
      metrics: [
        { label: 'p99 Latency', currentValue: '3.6ms', previousValue: '4.2ms', changeNote: '↓ 14.2% Under 25k RPS', positive: true },
        { label: 'API Compatibility', currentValue: 'Zero Breaking', changeNote: 'Full SDK backwards-compat', positive: false }
      ],
      bulletPoints: [
        'Stress tested against 25k rps artificial payload: zero dropped connections.',
        'Client session validation overhead curtailed to sub-millisecond ranges.'
      ],
      references: [
        { id: 1, type: 'sentry', title: 'Sentry #AUTH-892', desc: 'Connection Pool Leak (P1 Critical)', iconColor: 'bg-red-500' },
        { id: 2, type: 'notion', title: 'Notion RFC-088', desc: 'Valkey Migration RFC & Benchmarks', icon: 'article', iconColor: 'text-indigo-600' },
        { id: 3, type: 'pr', title: 'PR #142', desc: 'auth/session.go', icon: 'merge', iconColor: 'text-emerald-600' },
        { id: 4, type: 'linear', title: 'Linear ENG-489', desc: 'Auth session cluster rollout', icon: 'check_box', iconColor: 'text-indigo-600' }
      ],
      checklist: [
        { id: 'c1', label: 'Validated Valkey failover in staging environment', completed: true },
        { id: 'c2', label: 'Verified backwards compatibility with legacy session tokens', completed: true },
        { id: 'c3', label: 'Update Helm deployment env variables', badge: 'VALKEY_SENTINEL_ADDR', completed: false },
        { id: 'c4', label: 'Run canary release on US-East-1 cluster', completed: false },
        { id: 'c5', label: 'Resolve Sentry issue #AUTH-892 & verify zero Redis pool exceptions', completed: false },
        { id: 'c6', label: 'Sync benchmark results to Notion Engineering Wiki (RFC-088)', completed: false }
      ],
      files: [
        {
          id: 'f1',
          name: 'pkg/auth/session.go',
          status: 'M',
          statusColor: 'bg-emerald-500',
          lang: 'Go 1.22',
          lines: [
            { num: 104, type: 'context', text: 'func (s *Store) Revoke(ctx context.Context, uid string) error {' },
            { num: 105, type: 'del', text: 'err := rdb.Del(ctx, "session:"+uid).Err()' },
            { num: 105, type: 'add', text: 'err := valkey.RevokeSessionPipeline(ctx, s.cluster, uid)' },
            { num: 106, type: 'context', text: '    if err != nil {' },
            { num: 107, type: 'context', text: '        return fmt.Errorf("session store: %w", err)' }
          ]
        },
        {
          id: 'f2',
          name: 'config/valkey.yaml',
          status: 'A',
          statusColor: 'bg-indigo-500',
          lang: 'YAML',
          lines: [
            { num: 1, type: 'add', text: 'cluster:' },
            { num: 2, type: 'add', text: '  enabled: true' },
            { num: 3, type: 'add', text: '  nodes:' },
            { num: 4, type: 'add', text: '    - host: valkey-sentinel-0.internal' },
            { num: 5, type: 'add', text: '      port: 26379' }
          ]
        }
      ]
    };

    function App() {
      const [data, setData] = useState(initialData);
      const [activeTab, setActiveTab] = useState('pr-context');
      const [activeFileId, setActiveFileId] = useState('f1');
      const [isRegen, setIsRegen] = useState(false);
      const [toast, setToast] = useState({ show: false, msg: '' });
      const [searchModal, setSearchModal] = useState(false);
      const [repoMenuOpen, setRepoMenuOpen] = useState(false);
      const [selectedRepo, setSelectedRepo] = useState('Acme Core / Main Repo');
      const [chatInput, setChatInput] = useState('');
      const [chatMessages, setChatMessages] = useState([
        {
          id: 1,
          sender: 'user',
          text: 'Why did we pick Valkey cluster pipeline over single Redis instance?'
        },
        {
          id: 2,
          sender: 'ai',
          text: 'According to ADR-009 §4.2 and Sentry incident AUTH-892, our single Redis connection pool choked under 25k RPS during bulk token revocations. The Valkey pipeline multiplexes token invalidations across 3 partitioned shards with zero mutex lock contention, curtailing p99 latency from 4.2ms to 3.6ms.',
          code: 'valkey.RevokeSessionPipeline(ctx, s.cluster, uid)'
        }
      ]);

      const timerRef = useRef(null);

      const showToast = useCallback((msg) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setToast({ show: true, msg });
        timerRef.current = setTimeout(() => {
          setToast({ show: false, msg: '' });
        }, 2200);
      }, []);

      const toggleCheck = (id) => {
        setData(prev => ({
          ...prev,
          checklist: prev.checklist.map(c => c.id === id ? { ...c, completed: !c.completed } : c)
        }));
      };

      const copyToClipboard = (text, label) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        }
        showToast(label);
      };

      const handleRegen = () => {
        setIsRegen(true);
        showToast('Synthesizing fresh rationale from latest AST...');
        setTimeout(() => {
          setIsRegen(false);
          setData(prev => ({
            ...prev,
            confidence: Number((99.2 + Math.random() * 0.7).toFixed(1))
          }));
          showToast('Rationale updated with latest AST!');
        }, 1200);
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = { id: Date.now(), sender: 'user', text: chatInput };
        setChatMessages(prev => [...prev, newMsg]);
        setChatInput('');
        setTimeout(() => {
          setChatMessages(prev => [
            ...prev,
            {
              id: Date.now() + 1,
              sender: 'ai',
              text: `Analyzed AST for "${newMsg.text}". All references in pkg/auth/session.go and config/valkey.yaml maintain strict backwards compatibility.`
            }
          ]);
        }, 800);
      };

      const currentFile = data.files.find(f => f.id === activeFileId) || data.files[0];
      const completedCount = data.checklist.filter(c => c.completed).length;

      const navTabs = [
        { id: 'pr-context', label: 'PR Context', icon: 'difference' },
        { id: 'semantic-chat', label: 'Semantic Chat', icon: 'chat_spark' },
        { id: 'data-sources', label: 'Data Sources', icon: 'schema', badge: '4' },
        { id: 'overview', label: 'Pipeline Overview', icon: 'dashboard' }
      ];

      return (
        <div className="flex w-full min-h-screen bg-slate-50 text-slate-900 antialiased font-sans">
          {/* Toast Notification */}
          <div className={`fixed top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-slate-900 text-white rounded-full shadow-lg flex items-center gap-2 z-50 pointer-events-none transition-all duration-200 ${toast.show ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 -translate-y-2 scale-95'}`}>
            <span className="material-symbols-outlined text-[18px] text-emerald-400">check</span>
            <span className="text-xs font-medium">{toast.msg}</span>
          </div>

          {/* ⌘K Search Modal */}
          {searchModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-start justify-center pt-20 px-4" onClick={() => setSearchModal(false)}>
              <div className="w-full max-w-lg bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden" onClick={e => e.stopPropagation()}>
                <div className="p-3.5 border-b border-slate-200 flex items-center gap-2">
                  <span className="material-symbols-outlined text-slate-400">search</span>
                  <input type="text" autoFocus placeholder="Search PR rationale, symbols, or issues..." className="w-full text-sm outline-hidden text-slate-800 placeholder-slate-400 bg-transparent" />
                  <button onClick={() => setSearchModal(false)} className="text-xs font-mono text-slate-400 hover:text-slate-600 px-1.5 py-0.5 rounded border border-slate-200 hover:bg-slate-100 cursor-pointer">ESC</button>
                </div>
                <div className="p-3 text-xs text-slate-500 flex flex-col gap-1.5">
                  <span className="font-semibold text-slate-700">Quick Searches:</span>
                  <button onClick={() => { setSearchModal(false); showToast('Opened Sentry AUTH-892 trace'); }} className="text-left px-2.5 py-2 rounded-lg hover:bg-slate-100 flex items-center justify-between group transition cursor-pointer">
                    <span className="group-hover:text-indigo-600 font-medium text-slate-800">Sentry: AUTH-892 pool exhaustion</span>
                    <span className="text-[10px] font-mono text-slate-400">Crash Trace</span>
                  </button>
                  <button onClick={() => { setSearchModal(false); showToast('Opened Notion RFC-088'); }} className="text-left px-2.5 py-2 rounded-lg hover:bg-slate-100 flex items-center justify-between group transition cursor-pointer">
                    <span className="group-hover:text-indigo-600 font-medium text-slate-800">Notion: RFC-088 Valkey migration</span>
                    <span className="text-[10px] font-mono text-slate-400">Design RFC</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LEFT STRUCTURAL NAVIGATION RAIL (Desktop) */}
          <aside className="hidden md:flex flex-col justify-between w-16 lg:w-56 bg-white border-r border-slate-200 h-screen sticky top-0 z-40 select-none flex-shrink-0">
            <div className="flex flex-col">
              <div className="h-14 flex items-center px-3.5 lg:px-4 border-b border-slate-200 gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-xs flex-shrink-0">CB</div>
                <div className="hidden lg:flex flex-col min-w-0">
                  <span className="text-sm font-bold tracking-tight text-slate-900 leading-none truncate">ContextBridge</span>
                  <span className="text-[10px] font-mono text-indigo-600 font-semibold uppercase tracking-wider truncate mt-0.5">Precision L2</span>
                </div>
              </div>

              <nav className="p-2 lg:p-3 flex flex-col gap-1">
                {navTabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-3 px-2.5 py-2 rounded-lg text-xs font-medium transition cursor-pointer ${
                      activeTab === tab.id ? 'bg-indigo-50 text-indigo-600 font-bold shadow-2xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                    title={tab.label}
                  >
                    <span className={`material-symbols-outlined text-[20px] ${activeTab === tab.id ? 'text-indigo-600' : 'text-slate-500'}`}>{tab.icon}</span>
                    <span className="hidden lg:inline truncate flex-1 text-left">{tab.label}</span>
                    {tab.badge && <span className="hidden lg:inline text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold">{tab.badge}</span>}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-2 lg:p-3 border-t border-slate-200 flex flex-col gap-2">
              <div className="hidden lg:flex items-center justify-between text-[11px] font-mono text-slate-500 px-1">
                <span className="flex items-center gap-1.5 text-emerald-600 font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  Synced
                </span>
                <span>v2.4.0</span>
              </div>
              <div className="flex items-center gap-2.5 px-1 py-1 rounded-lg hover:bg-slate-100 cursor-pointer">
                <div className="w-8 h-8 rounded-full bg-slate-200 ring-1 ring-slate-300 flex items-center justify-center text-slate-600 text-xs font-semibold overflow-hidden flex-shrink-0">
                  <span className="material-symbols-outlined text-[20px] text-slate-500">account_circle</span>
                </div>
                <div className="hidden lg:flex flex-col min-w-0">
                  <span className="text-xs font-semibold text-slate-800 truncate">Rucha Core</span>
                  <span className="text-[10px] text-slate-400 truncate">Staff Engineer</span>
                </div>
              </div>
            </div>
          </aside>

          {/* FLUID FULL-WIDTH CENTER CANVAS (Uses 100% of the screen width!) */}
          <div className="flex-1 flex flex-col min-w-0 w-full">
            {/* Edge-to-Edge Top Toolbar */}
            <header className="w-full bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 select-none">
              <div className="hidden md:flex items-center justify-between h-14 px-4 lg:px-8 w-full gap-4">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="relative">
                    <button onClick={() => setRepoMenuOpen(!repoMenuOpen)} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-100 border border-slate-200 hover:bg-slate-200/70 text-slate-700 transition-all text-xs font-mono font-medium cursor-pointer">
                      <span className="material-symbols-outlined text-[16px] text-emerald-600">fork_right</span>
                      <span className="truncate max-w-[180px]">{selectedRepo}</span>
                      <span className="material-symbols-outlined text-[14px] text-slate-400">expand_more</span>
                    </button>
                  </div>

                  <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-emerald-50 border border-emerald-200 text-emerald-700">
                    <span className="relative flex h-2 w-2">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-600"></span>
                    </span>
                    <span className="text-[10px] font-mono font-bold uppercase tracking-wide">LIVE L2</span>
                  </div>

                  <div className="h-4 w-px bg-slate-200 hidden xl:block"></div>

                  <div className="hidden xl:flex items-center gap-1.5 text-xs font-mono text-slate-600 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-md">
                    <span className="material-symbols-outlined text-[14px] text-indigo-600">alt_route</span>
                    <span className="font-semibold text-slate-800">{data.sourceBranch}</span>
                    <span className="text-slate-400">➔</span>
                    <span className="text-slate-600">{data.targetBranch}</span>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="flex items-center gap-2.5 px-3 py-1 rounded-lg bg-slate-50 border border-slate-200 text-xs font-mono">
                    <span className="text-[10px] uppercase font-bold text-slate-400">Quota</span>
                    <div className="flex items-center gap-2">
                      <div className="w-24 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-500 rounded-full" style={{ width: '28.56%' }}></div>
                      </div>
                      <span className="font-semibold text-slate-700 text-[11px]">14.3k / 50k</span>
                    </div>
                  </div>

                  <button onClick={() => setSearchModal(true)} className="h-8 px-3 bg-slate-100 hover:bg-slate-200/80 border border-slate-200 rounded-lg flex items-center gap-2 text-slate-600 transition text-xs cursor-pointer">
                    <span className="material-symbols-outlined text-[15px] text-slate-500">search</span>
                    <span className="text-slate-500 font-medium hidden lg:inline">Search codebase...</span>
                    <span className="text-[10px] font-mono bg-white border border-slate-200 px-1.5 py-0.5 rounded text-slate-500 shadow-2xs">⌘K</span>
                  </button>

                  <button onClick={() => { setActiveTab('data-sources'); showToast('Opened Data Sources'); }} className="h-8 px-3.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition shadow-xs active:scale-95 cursor-pointer">
                    <span className="material-symbols-outlined text-[15px]">add</span>
                    <span>Connect Source</span>
                  </button>
                </div>
              </div>

              {/* Mobile Bar */}
              <div className="md:hidden flex items-center justify-between p-3">
                <span className="font-bold text-sm text-slate-900">ContextBridge</span>
                <span className="text-xs font-mono text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">LIVE L2</span>
              </div>
            </header>

            {/* True Edge-to-Edge Workstation Container */}
            <main className="flex-1 p-4 lg:p-6 w-full pb-20 md:pb-6">

              {/* TAB 1: PR CONTEXT (Full-Width 12-Column Split Workspace) */}
              {activeTab === 'pr-context' && (
                <div className="flex flex-col gap-5 w-full">
                  <div className="relative w-full rounded-xl bg-white border border-slate-200 p-3.5 shadow-xs">
                    <div className="flex items-center justify-between gap-1 mb-2">
                      <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
                        <span className="text-[10px] font-mono uppercase tracking-wider font-bold">PR Synthesis Live</span>
                      </div>
                      <button onClick={() => copyToClipboard(data.commitSha, `Commit SHA ${data.commitSha} copied!`)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-mono transition cursor-pointer">
                        <span className="material-symbols-outlined text-[13px] text-indigo-600">commit</span>
                        <span className="font-semibold text-slate-800">{data.commitSha}</span>
                      </button>
                    </div>

                    <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 p-1.5 rounded-lg mb-2">
                      <div className="flex items-center gap-1.5 min-w-0 flex-1 px-2.5 py-1.5 rounded bg-white border border-slate-200 text-slate-900 truncate">
                        <span className="material-symbols-outlined text-[15px] text-indigo-600">alt_route</span>
                        <span className="text-xs font-mono truncate font-medium text-slate-800">{data.sourceBranch}</span>
                      </div>
                      <span className="material-symbols-outlined text-[15px] text-slate-400 flex-shrink-0">arrow_forward</span>
                      <div className="flex items-center gap-1.5 px-2.5 py-1.5 rounded bg-slate-100 border border-slate-200 text-slate-600 flex-shrink-0">
                        <span className="material-symbols-outlined text-[15px] text-emerald-600">source_notes</span>
                        <span className="text-xs font-mono font-semibold text-slate-700">{data.targetBranch}</span>
                      </div>
                    </div>

                    <div className="flex items-center justify-between gap-2 pt-1">
                      <span className="text-xs font-mono px-2.5 py-1 rounded-md bg-slate-100 border border-slate-200 text-slate-600 flex items-center gap-1.5 font-medium">
                        <span className="text-emerald-600 font-bold">+{data.additions}</span>
                        <span className="text-slate-300">/</span>
                        <span className="text-red-600 font-bold">-{data.deletions}</span>
                        <span className="text-slate-400 text-[10px] ml-0.5">· {data.fileCount} files</span>
                      </span>
                      <button onClick={() => showToast('Opening GitHub Pull Request draft...')} className="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm active:scale-95 transition-all cursor-pointer">
                        <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                        <span>Push to GitHub</span>
                      </button>
                    </div>
                  </div>

                  {/* 12-Column Split Workspace */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 w-full items-start">
                    {/* Left (7 or 8 Columns): High-Density Code Diff Viewer */}
                    <div className="lg:col-span-7 xl:col-span-8 flex flex-col gap-4 w-full">
                      <div className="flex flex-col w-full rounded-xl bg-white border border-slate-200 overflow-hidden shadow-xs">
                        <div className="px-4 py-2.5 flex items-center justify-between bg-slate-50 border-b border-slate-200">
                          <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                            {data.files.map(f => (
                              <button key={f.id} onClick={() => setActiveFileId(f.id)} className={`px-3 py-1.5 rounded-lg text-xs font-mono flex items-center gap-1.5 transition cursor-pointer ${activeFileId === f.id ? 'bg-white border border-slate-300 text-slate-900 font-semibold shadow-2xs' : 'hover:bg-slate-100 text-slate-500'}`}>
                                <span className={`w-2 h-2 rounded-full ${f.statusColor}`}></span>
                                <span>{f.name}</span>
                                <span className="text-[10px] font-mono text-slate-400 ml-1">{f.status}</span>
                              </button>
                            ))}
                          </div>
                        </div>

                      </div>
                    </div>

                    {/* Right (5 or 4 Columns): Sticky Rationale & Spec Inspector */}

                          </div>

                                  </span>
                                </label>
                              ))}
                            </div>
                          </div>

                          <div className="grid grid-cols-3 gap-2 pt-1">
                            <button onClick={() => copyToClipboard(`# ${data.title}\n\n${data.whyContext}`, 'Spec Markdown copied!')} className="py-2 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1 transition cursor-pointer">
                              <span className="material-symbols-outlined text-[16px] text-indigo-600">markdown</span>
                              <span>Copy MD</span>
                            </button>

                              <span>Export Jira</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: SEMANTIC CHAT (Full-Width Studio) */}

                          <div className="flex items-center gap-2">
                            <span className="material-symbols-outlined text-[18px] text-emerald-600">check_circle</span>
                            <div className="flex flex-col">
                              <span className="text-xs font-semibold text-slate-900">{t.title}</span>
                              <span className="text-[10px] text-slate-500">{t.detail}</span>

                  </div>

                  <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-xs flex flex-col gap-3">
                    <span className="text-sm font-bold text-slate-900">Benchmark Telemetry (vs Redis)</span>
                    <div className="flex flex-col gap-2.5">
                      <div className="p-3 rounded-lg bg-slate-50 border border-slate-200 flex flex-col gap-1">
                        <span className="text-[10px] font-mono uppercase text-slate-400 font-bold">Session Revocation Latency</span>
                        <div className="flex items-baseline justify-between">
                          <span className="text-lg font-bold text-emerald-600">3.6ms</span>
                          <span className="text-xs font-mono text-slate-400 line-through">4.2ms baseline</span>
                        </div>
                        <span className="text-[10px] text-emerald-700 font-semibold font-mono">↓ 14.2% Under 25,000 RPS</span>
                      </div>
                      <div className="p-3 rounded-lg bg-slate-50 border border-slate-200 flex flex-col gap-1">
                        <span className="text-[10px] font-mono uppercase text-slate-400 font-bold">Connection Pool Health</span>
                        <div className="flex items-baseline justify-between">
                          <span className="text-lg font-bold text-indigo-600">0 Exhaustions</span>
                          <span className="text-xs font-mono text-slate-500">Fixes AUTH-892</span>
                        </div>
                        <span className="text-[10px] text-slate-500 font-mono">Multiplexed across 3 Valkey shards</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
